# Source of truth for AI models approved for use at Nesto.
#
# Edit via pull request only. Tiers are NOT set here: they are derived from these
# facts by model_registry/policy.py. To approve a model for bank clients, record
# facts that justify it (Canadian residency or self-hosted open weights, generally
# available at the provider, and no training on customer data) and set
# status: approved.
#
# ONE ROW PER MODEL. The production gateway also serves five Canadian-region
# aliases (`-ca` suffix) that point at the same underlying Vertex models pinned to
# northamerica-northeast1. They are deliberately NOT separate entries here; where a
# model has one, it is recorded on the parent as `canadian_alias`.
#
#   Consequences to expect, so nobody mistakes them for faults:
#     - The drift check will report the five `-ca` names as served-but-unapproved
#       on its first real run against production. That is this layout choice
#       surfacing, not a gateway problem.
#     - The PR scanner will treat a `-ca` name in code as an unknown model and warn
#       (it will not block, since unknown IDs warn by default).
#     - The TD environments (td-dev, td-sit1, td-sit2) serve ONLY the five `-ca`
#       names. The bare ids listed below are not available there.
#
# REGION AND RESIDENCY ARE SOURCED, NOT GUESSED. Every `region` below is the
# `vertex_location` the production LiteLLM gateway actually routes that id to:
#   catalog/environments/production/releases/data-science/litellm.yaml
#
# `residency: multi` records Vertex's `global` endpoint, which gives no regional
# guarantee — it is not Canadian residency and must not be read as such.
#
# LAUNCH STAGE IS A RESIDENCY FACT, NOT METADATA. Google's Vertex AI data residency
# commitments explicitly exclude any feature in experimental or preview launch
# status, so a preview model can carry a regional value while Google commits nothing
# about where it is processed. The bank tier therefore requires `ga`. It is
# `unverified` almost everywhere below because GA status has not been confirmed per
# model — an unrecorded fact, not an assumption of the worst case.
#
# VERIFIED AGAINST GOOGLE'S DOCUMENTATION, 2026-09-16:
#   - Global endpoints "don't provide regional isolation or data residency
#     guarantees", and you "can't control or know which region your ML processing
#     requests are sent to".
#     https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/locations
#   - Residency commitments exclude experimental and preview launch stages.
#     https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/data-residency
#   - Google does not use customer data to train its models without permission,
#     which is the basis for trains_on_customer_data: false.
#     https://cloud.google.com/vertex-ai
#
# OPEN QUESTION — CANADIAN ML-PROCESSING COMMITMENT. Google's docs are not
# consistent on whether the machine-learning-processing residency commitment (as
# opposed to data-at-rest) extends to Canada: one page limits the AI/ML data
# location commitment to US and EU locations, while Gemini 3.5 Flash is separately
# described as available in Canada with both. Resolve with Google or through the DPA
# before approving anything for bank clients.
#
# STATUS IS STILL `trial` EVERYWHERE. Location facts are verified; approving a model
# is a human decision made in a reviewed PR.

- id: gemini-2.5-pro
  display_name: Gemini 2.5 Pro
  provider: google
  hosting: vertex
  region: global
  residency: multi
  open_weights: false
  trains_on_customer_data: false
  launch_stage: unverified
  use_cases: [ocr, general]
  status: trial
  approved_on: 2026-09-16
  approval_ref: seed from catalog production litellm.yaml — no approval PR yet
  review_by: 2027-03-16
  notes: Vertex `global` endpoint. Use gemini-2.5-pro-ca for anything touching bank-client data.
  gateway:
    model_name: gemini-2.5-pro
  canadian_alias: gemini-2.5-pro-ca
  canadian_alias_region: northamerica-northeast1

