# Source of truth for AI models approved for use at Nesto.
#
# Edit via pull request only. Tiers are NOT set here: they are derived from these
# facts by model_registry/policy.py. To approve a model for bank clients, record
# facts that justify it (Canadian residency or self-hosted open weights, and no
# training on customer data) and set status: approved.
#
# REGION AND RESIDENCY ARE SOURCED, NOT GUESSED. Every `region` below is the
# `vertex_location` the production LiteLLM gateway actually routes that model to:
#   catalog/environments/production/releases/data-science/litellm.yaml
# The `-ca` suffixed ids are the Canadian-region aliases; they point at the same
# underlying Vertex models as their bare counterparts, but pinned to
# northamerica-northeast1. The TD environments (td-dev, td-sit1, td-sit2) serve
# ONLY the `-ca` set.
#
# `residency: multi` records Vertex's `global` endpoint, which gives no regional
# guarantee — it is not Canadian residency, and must not be read as such.
#
#
# LAUNCH STAGE IS A RESIDENCY FACT, NOT METADATA. Google's Vertex AI data residency
# commitments explicitly exclude any feature in experimental or preview launch
# status, so a preview model can carry a Canadian `region` while Google commits
# nothing about where it is processed. `launch_stage` is therefore recorded per
# model and the bank tier requires `ga`. It is `unverified` almost everywhere below
# because GA status has not been confirmed per model — that is an unrecorded fact,
# not an assumption of the worst case.
#
# VERIFIED AGAINST GOOGLE'S DOCUMENTATION, 2026-09-16:
#   - Global endpoints "don't provide regional isolation or data residency
#     guarantees", and you "can't control or know which region your ML processing
#     requests are sent to". Hence residency: multi for every `global` entry.
#     https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/locations
#   - Residency commitments exclude experimental and preview launch stages.
#     https://docs.cloud.google.com/vertex-ai/generative-ai/docs/learn/data-residency
#   - Google does not use customer data to train its models without permission,
#     which is the basis for trains_on_customer_data: false.
#     https://cloud.google.com/vertex-ai
#
# OPEN QUESTION — CANADIAN ML-PROCESSING COMMITMENT. Google's docs are not
# consistent on whether the machine-learning-processing residency commitment (as
# opposed to data-at-rest) extends to Canada: one page states the AI/ML data
# location commitment is supported only in US and EU locations, while Gemini 3.5
# Flash is separately described as available in Canada with both at-rest residency
# and ML processing. Until that is resolved with Google or through the DPA, the
# `canada` residency values below are grounded in the gateway's regional pinning,
# not in a confirmed contractual ML-processing guarantee. Resolve before approving
# any entry for bank clients.
#
# STATUS IS STILL `trial` EVERYWHERE. The location facts are now verified; the
# governance decision to approve a model is a human one. Flipping a `-ca` entry to
# `approved` grants it the bank tier automatically via the policy rules.

# --- Canadian region: northamerica-northeast1 -------------------------------
# These five are the only models the gateway serves from Canada, and the only
# ones the TD environments expose.

- id: gemini-2.5-pro-ca
  display_name: Gemini 2.5 Pro (Canada)
  provider: google
  hosting: vertex
  region: northamerica-northeast1
  residency: canada
  open_weights: false
  trains_on_customer_data: false
  launch_stage: unverified
  use_cases: [ocr, general]
  status: trial
  approved_on: 2026-09-16
  approval_ref: seed from catalog production litellm.yaml — no approval PR yet
  review_by: 2027-03-16
  notes: >-
    Canadian-region alias for vertex_ai/gemini-2.5-pro. Named in OG-28433 as the
    replacement for gemini-3.1-pro-preview, which Vertex does not offer in
    northamerica-northeast1. Retention terms not yet tied to a DPA reference.
  gateway:
    model_name: gemini-2.5-pro-ca

